  q: 필기에 따르면 trp 오페론의 조절은 on/off가 아니라 more/less이다. Trp가 많을 때 억제자에 의해 발현이 Trp 결핍 시의 약 $\tfrac1{70}$로 줄고, 여기에 전사 감쇠가 더해져 다시 약 $\tfrac1{10}$로 준다. Trp 결핍 시의 발현량은 Trp 과다 시의 약 몇 배인가?
  a: 700
  tol: 0.01
  unit: 배
  ex: $70\times10=700$배. 억제자(전사 개시 조절)와 감쇠(전사 종결 조절)가 곱으로 작용해요. 억제자가 활성화되어도 전사가 완전히 0이 되지는 않아요.
  ref:

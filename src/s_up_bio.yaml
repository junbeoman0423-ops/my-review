- id: bt03
  u: 발현 조절 기초
  t: mc
  lv: 1
  q: 진핵생물의 유전자 조절 영역에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?
  bg:
  - - 프로모터는 조절 프로모터와 핵심 프로모터로 나뉜다.
    - true
    - 핵심 프로모터(TATA 상자 등)에는 보편 전사 인자가, 조절 프로모터에는 특이적 전사 인자가 결합해요.
  - - 인핸서와 사일런서는 전사량을 조절하는 조절 영역이다.
    - true
    - 활성자가 인핸서에, 억제자가 사일런서에 결합해요.
  - - 진핵생물의 관련 유전자들은 오페론으로 묶여 하나의 mRNA로 함께 전사된다.
    - false
    - 오페론은 원핵의 조절 시스템이에요. 진핵은 유전자마다 프로모터가 따로 있고, 같은 조절 서열 조합으로 함께 조절돼요.
  ref:
  - bt:11
  - bt:12
- id: bt04
  u: 젖당 오페론
  t: mc
  lv: 2
  q: lac 오페론이 크게 발현되는 조건은?
  c:
  - 포도당 없음, 젖당 있음
  - 포도당 있음, 젖당 있음
  - 포도당 있음, 젖당 없음
  - 포도당 없음, 젖당 없음
  - 젖당 유무와 관계없이 포도당만 없으면 됨
  a: 0
  cx:
  - 포도당 고갈 → cAMP↑ → cAMP–CAP 결합(양의 조절 성공), 젖당 유입 → 알로락토오스가 억제자 불활성화(음의 조절 해제) → 크게 발현.
  - 포도당이 있으면 cAMP가 적어 CAP가 작동 못 해요(양의 조절 실패).
  - 양의 조절·음의 조절 모두 실패예요.
  - CAP는 작동하지만 억제자가 작동자에 붙어 있어요(음의 조절 그대로).
  - 젖당이 없으면 억제자가 작동자에 결합해 전사가 막혀요.
  ref:
  - bt:5

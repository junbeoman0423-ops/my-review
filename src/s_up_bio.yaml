# ===================== 생물 · 11/16 추가 자료 (박신 「유전자 및 전사」 · 「유전자 발현의 조절 2」 내 필기본) =====================
- id: bj01
  u: 유전자와 단백질
  t: mc
  lv: 1
  q: 유전자 개념의 변천에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?
  bg:
  - - 1유전자 1효소설은 유전자 이상으로 적혈구 모양이 바뀌는 등 효소가 아닌 단백질도 유전자가 암호화한다는 사실이 알려지며 수정되었다.
    - true
    - 겸형 적혈구(헤모글로빈 이상) → 1유전자 1단백질설로 수정.
  - - 1유전자 1단백질설은 진핵생물의 선택적 스플라이싱이 발견되며 기각되었다.
    - false
    - 헤모글로빈 4량체 중 한 종류의 폴리펩타이드만 이상이 있다는 관찰로 기각되어 1유전자 1폴리펩타이드설이 되었어요. 선택적 스플라이싱은 1유전자 1폴리펩타이드설을 기각한 근거예요.
  - - 현대적 의미의 유전자는 폴리펩타이드 또는 기능적 RNA를 암호화하는 DNA 부위이다.
    - true
    - tRNA·rRNA처럼 번역되지 않는 RNA도 포함 → 1유전자 1기능분자설.
  ref:
  - bj:1
- id: bj02
  u: 유전자와 단백질
  t: set
  lv: 3
  q: 붉은빵곰팡이의 아르지닌 합성 경로는 전구 물질 →(효소 A)→ 오르니틴 →(효소 B)→ 시트룰린 →(효소 C)→ 아르지닌이다. 표는 효소 A~C의 유전자 중 서로 다른 하나에만 돌연변이가 일어난 I~III을 최소 배지와 물질 ㉠~㉢(오르니틴, 시트룰린, 아르지닌 중 하나)을 각각 첨가한 배지에서 기른 결과이다. [8점]
  tb: '<table><tr><th>균주</th><th>최소 배지</th><th>+㉠</th><th>+㉡</th><th>+㉢</th></tr><tr><td>야생형</td><td>+</td><td>+</td><td>+</td><td>+</td></tr><tr><td>I</td><td>−</td><td>−</td><td>+</td><td>−</td></tr><tr><td>II</td><td>−</td><td>+</td><td>+</td><td>+</td></tr><tr><td>III</td><td>−</td><td>+</td><td>+</td><td>−</td></tr></table><div class="sub">(+: 생장함, −: 생장 못 함)</div>'
  parts:
  - p: ㉡은 무엇인가?
    t: txt
    a:
    - 아르지닌
    - 아르기닌
    - arginine
    pt: 2
    sol: 모든 돌연변이주를 살리는 물질은 경로의 최종 산물인 아르지닌이에요.
  - p: ㉢은 무엇인가?
    t: txt
    a:
    - 오르니틴
    - ornithine
    pt: 2
    sol: 가장 많은 균주를 살리지 못하는(II만 살리는) 물질이 가장 앞쪽 중간 산물 → 오르니틴. 따라서 ㉠은 시트룰린.
  - p: III은 효소 A~C 중 어느 효소의 유전자에 돌연변이가 일어난 것인가?
    t: txt
    a:
    - B
    - 효소 B
    - b
    pt: 2
    sol: III은 시트룰린(㉠)·아르지닌으로는 자라지만 오르니틴(㉢)으로는 못 자라요 → 오르니틴→시트룰린 단계(B) 결함. I은 C, II는 A 결함.
  - p: 이 실험에 붉은빵곰팡이를 쓰는 이유를 서술하시오.
    t: essay
    pt: 2
    kp:
    - 붉은빵곰팡이의 영양 생장 시기 핵상은 반수체(n)
    - 대립유전자가 하나뿐이라 돌연변이가 바로 표현형으로 나타남
    - 최소 배지에서도 잘 자람(배양이 쉬움)
    sol: 붉은빵곰팡이는 반수체(n)라 대립유전자가 하나뿐이므로 X선으로 생긴 돌연변이가 열성이어도 바로 표현형으로 나타난다. 또 최소 배지에서 쉽게 배양할 수 있다.
  ref:
  - bj:2
  - bj:3
- id: bj03
  u: 유전자와 단백질
  t: mc
  lv: 2
  q: 붉은빵곰팡이의 아르지닌 합성 경로는 전구 물질 →(효소 a)→ 오르니틴 →(효소 b)→ 시트룰린 →(효소 c)→ 아르지닌이다. 표는 아르지닌을 필요로 하는 돌연변이주 I~III에서 효소 a~c의 합성 여부이다. (최소 배지에는 전구 물질이 있으며, 효소 유전자 외의 돌연변이는 없다.)
  tb: <table><tr><th>균주</th><th>효소 a</th><th>효소 b</th><th>효소 c</th></tr><tr><td>야생형</td><td>+</td><td>+</td><td>+</td></tr><tr><td>I</td><td>−</td><td>+</td><td>+</td></tr><tr><td>II</td><td>+</td><td>−</td><td>+</td></tr><tr><td>III</td><td>+</td><td>+</td><td>−</td></tr></table>
  bg:
  - - I은 오르니틴을 첨가한 최소 배지에서 생장한다.
    - true
    - I은 a만 없어요. 오르니틴을 주면 b, c로 아르지닌까지 만들어요.
  - - II를 최소 배지에 넣으면 세포 내 오르니틴의 양이 증가한다.
    - true
    - b가 없어 오르니틴→시트룰린이 막히니 앞 단계 물질(오르니틴)이 쌓여요.
  - - III은 II가 생장하는 모든 배지에서 생장한다.
    - false
    - II는 시트룰린 배지에서 자라지만 III(c 결함)은 시트룰린으로는 못 자라요. 반대로 III이 자라는 배지(아르지닌)에서는 II도 자라요.
  ref:
  - bj:8
  - bj:10
- id: bj04
  u: 중심원리·전사
  t: mc
  lv: 2
  q: 원핵세포의 RNA 중합효소와 시그마(σ) 인자에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?
  bg:
  - - 완전 효소는 α, α, β, β′, ω, σ로 이루어지며, σ를 뺀 나머지를 핵심 효소라고 한다.
    - true
    - α₂ββ′ω = 핵심 효소, σ = 보조 인자.
  - - σ 인자가 없으면 핵심 효소는 프로모터를 정확히 인식하지 못해 정해진 위치에서 전사를 시작하기 어렵다.
    - true
    - σ는 −35, −10(프리브나우 상자) 서열을 인식해 중합효소를 정확한 자리에 앉혀요.
  - - σ 인자는 전사가 끝날 때까지 핵심 효소에 붙어 함께 이동한다.
    - false
    - σ는 개시 직후(약 10 뉴클레오타이드 합성 뒤) 떨어져 나가 다른 핵심 효소에 재사용돼요.
  ref:
  - bj:11
  - bj:12
- id: bj05
  u: 중심원리·전사
  t: mc
  lv: 2
  q: 원핵세포의 ρ(로) 비의존적 전사 종결에서 형성되는 헤어핀(줄기–고리) 구조에 대한 설명으로 옳지 않은 것은?
  c:
  - A·U 염기쌍이 많아 쉽게 풀리므로 RNA를 주형에서 떼어 낸다.
  - 종결 부위 DNA에 역반복(회문) 서열이 있어 만들어진다.
  - 줄기 부분은 G·C 함량이 높다.
  - 헤어핀 바로 뒤에는 U가 연속된 서열이 있다.
  - 헤어핀이 생기면 주형 DNA와 RNA 사이의 결합력이 약해진다.
  a: 0
  cx:
  - 줄기는 G·C가 많아 안정해요. 약한 것은 뒤쪽 U 연속(A–U 결합) 부분이라 그곳에서 RNA가 떨어져요. 그래서 옳지 않아요.
  - 역반복 서열이 전사되어 RNA가 스스로 접혀요(옳음).
  - G·C는 수소 결합 3개라 줄기가 단단해요(옳음).
  - U 연속 – 주형의 A와 약한 결합(옳음).
  - 중합효소가 멈추고 RNA–DNA 결합이 약해져 분리돼요(옳음).
  ref:
  - bj:14
  - bj:15
- id: bj06
  u: 중심원리·전사
  t: essay
  q: 시험관에서 같은 DNA를 주형으로 전사시켰을 때, ρ(로) 인자가 있으면 일정한 길이의 RNA만 생기고 ρ 인자가 없으면 다양한(더 긴) 길이의 RNA가 생겼다. 이 결과로 알 수 있는 ρ 인자의 역할과 작용 방식을 서술하시오. [4점]
  kp:
  - ρ 인자는 특정 종결 부위에서 전사를 끝내게 하는 단백질(ρ 의존적 종결)
  - ρ가 없으면 중합효소가 종결 부위를 지나쳐 계속 전사 → 길이가 제각각
  - ρ는 RNA의 rut 부위에 결합해 RNA를 따라 이동
  - 헬리카제 활성으로 RNA–DNA 혼성을 풀어 RNA를 떼어 냄
  sol: ρ 인자는 ρ 의존적 종결 부위에서 전사를 끝내는 단백질이다. ρ는 새로 합성된 RNA의 결합 부위(rut)에 붙어 RNA를 따라 이동하다가, 종결 부위에서 멈춘 중합효소를 따라잡아 헬리카제 활성으로 RNA–DNA를 풀어 RNA를 떼어 낸다. ρ가 없으면 종결이 일정하지 않아 다양한 길이의 RNA가 만들어진다.
  ref:
  - bj:15
- id: bj07
  u: 중심원리·전사
  t: mc
  lv: 2
  q: 진핵세포의 핵을 낮은 농도의 α-아마니틴(전사 억제 독소)으로 처리했을 때 합성이 가장 먼저(가장 민감하게) 억제되는 RNA는?
  c:
  - mRNA 전구체
  - 28S·18S·5.8S rRNA
  - tRNA
  - 5S rRNA
  - 미토콘드리아 DNA의 RNA
  a: 0
  cx:
  - mRNA를 만드는 RNA 중합효소 II가 α-아마니틴에 가장 민감해요. 이런 독소 감수성 차이로 진핵 중합효소가 여러 종류임을 알아냈어요.
  - 큰 rRNA는 RNA 중합효소 I(인에서 작용)이 만들고 α-아마니틴에 거의 둔감해요.
  - tRNA는 RNA 중합효소 III이 만들며 높은 농도에서야 억제돼요.
  - 5S rRNA도 RNA 중합효소 III 담당이에요.
  - 미토콘드리아는 핵과 다른 별도의 (단일 소단위) 중합효소를 써서 α-아마니틴에 둔감해요.
  ref:
  - bj:16
- id: bj08
  u: 중심원리·전사
  t: mc
  lv: 2
  q: 진핵세포의 전사 개시에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?
  bg:
  - - TFⅡD는 TATA 상자를 인식하며, 세균의 σ 인자와 비슷한 역할을 한다.
    - true
    - TFⅡD의 TBP가 TATA 상자에 결합해 개시 복합체의 출발점이 돼요.
  - - TFⅡH는 헬리카제 활성으로 DNA를 풀고, RNA 중합효소 Ⅱ를 인산화한다.
    - true
    - CTD 인산화 → 중합효소가 보편 전사 인자에서 떨어져 신장 단계로 넘어가요.
  - - 진핵의 RNA 중합효소 Ⅱ는 단독으로 프로모터를 인식해 결합한다.
    - false
    - 보편 전사 인자(GTF)들이 먼저 프로모터에 모여야 중합효소가 결합할 수 있어요.
  ref:
  - bj:17
- id: bj09
  u: 중심원리·전사
  t: mc
  lv: 2
  q: 진핵세포의 전사 후 가공에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?
  bg:
  - - 5′ 말단에는 7-메틸구아노신 캡이 붙는다.
    - true
    - 캡은 분해를 막고 리보솜이 mRNA를 인식하게 해요.
  - - 스플라이시오솜은 snRNA와 단백질로 된 snRNP(U1, U2, U4, U5, U6)로 이루어진다.
    - true
    - snRNP("스너프")들이 모여 인트론을 잘라 내는 복합체를 만들어요.
  - - 자가 스플라이싱에서는 단백질 효소 없이 RNA가 스스로 인트론을 제거한다.
    - true
    - 리보자임 기능 – RNA도 촉매 역할을 할 수 있다는 증거예요.
  ref:
  - bj:18
  - bj:19
- id: bj10
  u: 중심원리·전사
  t: mc
  lv: 1
  q: 원핵세포와 진핵세포의 전사를 비교한 것으로 옳지 않은 것은?
  c:
  - 진핵세포의 mRNA는 3′ 말단에 폴리 A 꼬리가 붙지 않는다.
  - 원핵세포는 전사와 번역이 동시에 일어날 수 있다.
  - 원핵세포는 RNA 중합효소가 1종류이고 진핵세포는 여러 종류이다.
  - 원핵세포에서는 σ 인자가, 진핵세포에서는 보편 전사 인자가 프로모터 인식에 관여한다.
  - 원핵세포의 mRNA는 여러 유전자를 함께 담은 폴리시스트론인 경우가 많다.
  a: 0
  cx:
  - 진핵 mRNA는 5′ 캡핑과 3′ 폴리 A 꼬리(테일링)가 필요해요. 그래서 옳지 않아요.
  - 핵막이 없어 전사 중인 mRNA에 리보솜이 바로 붙어요(옳음).
  - 진핵은 Pol Ⅰ, Ⅱ, Ⅲ(옳음).
  - 옳음.
  - lac 오페론처럼 lacZYA가 한 mRNA로 전사돼요(옳음).
  ref:
  - bj:20
  - bj:21
- id: bj11
  u: 중심원리·전사
  t: essay
  q: 선택적 스플라이싱의 생물학적 의의를 "유전자 수"와 "단백질 종류 수"를 이용해 서술하시오. [3점]
  kp:
  - 하나의 유전자에서 엑손을 다르게 조합
  - 여러 종류의 mRNA → 여러 폴리펩타이드 생성
  - 제한된 유전자 수로 더 많은 종류의 단백질을 만듦(유전자 수 < 단백질 수)
  - 1유전자 다펩타이드설의 근거
  sol: 선택적 스플라이싱은 한 유전자의 1차 전사체에서 엑손을 서로 다르게 조합해 여러 종류의 성숙 mRNA를 만든다. 그 결과 하나의 유전자에서 여러 폴리펩타이드가 만들어지므로, 진핵생물은 제한된 유전자 수로 그보다 많은 종류의 단백질을 합성할 수 있다(유전자 수 < 단백질 수).
  ref:
  - bj:19
- id: bt01
  u: 트립토판 오페론
  t: set
  lv: 3
  q: trp 오페론의 리더 서열(trpL)은 영역 1~4로 이루어지며, 영역 1에는 Trp 코돈이 2개 있다. 3–4 헤어핀은 종결자(어테뉴에이터), 2–3 헤어핀은 항종결자이다. 각 상황에서 trpL 끝의 전사 종결은 "ρ 의존" "ρ 비의존" "종결 안 됨" 중 무엇인지 쓰시오. [8점]
  parts:
  - p: Trp가 결합한 tRNA(Trp-tRNA)가 많을 때
    t: txt
    a:
    - ρ 비의존
    - rho 비의존
    - 로 비의존
    - 비의존
    pt: 2
    sol: 리보솜이 영역 1을 빨리 지나 영역 2를 덮음 → 3–4 헤어핀(+U 연속) 형성 → ρ 비의존 종결(전사 감쇠).
  - p: trpL의 Trp 코돈 2개를 결실시켰을 때 (Trp가 부족한 조건)
    t: txt
    a:

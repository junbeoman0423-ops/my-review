    - rho 비의존
    - 로 비의존
    - 비의존
    pt: 2
    sol: Trp가 부족해도 리보솜이 멈출 자리가 없어 항상 빨리 지나가요 → 3–4 형성 → ρ 비의존 종결. Trp 농도를 감지하지 못하게 돼요.
  - p: 리보솜이 영역 2에 머물도록 조작했을 때
    t: txt

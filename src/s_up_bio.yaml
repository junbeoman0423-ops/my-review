    - Trp 많으면 감쇠로 일부만 줄어듦(완전 차단 아님)
    sol: trpR이 없으면 Trp–억제자 복합체가 생기지 않아 작동자가 비어 있으므로 전사 개시는 계속 일어난다. Trp가 많을 때 감쇠(3–4 종결자)로 대부분의 전사가 리더 서열에서 끝나지만 일부는 구조 유전자까지 전사되므로 효소가 어느 정도 만들어진다.

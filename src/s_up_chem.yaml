# ===================== 화학 · 11/16 추가 자료 (The Origin 열화학 문제 · HOMEWORK 열역학 · 내 필기) =====================
- id: co01
  u: 반응엔탈피·헤스
  t: mc
  lv: 2
  q: 그림은 25 ℃ 표준 상태에서 $\mathrm{MCl}(s)$가 생성되는 경로이다. M은 Na 또는 K 중 하나이다.
  tb: '<div class="bogi" style="text-align:center">$2\mathrm{M}(s)+\mathrm{Cl_2}(g)\xrightarrow{\Delta H_1,\ \Delta H_2}2\mathrm{M^+}(g)+2\mathrm{Cl^-}(g)\xrightarrow{\Delta H_3}2\mathrm{MCl}(s)$<br>($\Delta H_1$: $2\mathrm{M}(s)\to2\mathrm{M^+}(g)$, $\Delta H_2$: $\mathrm{Cl_2}(g)\to2\mathrm{Cl^-}(g)$)</div>'
  bg:
  - - $\Delta H_2$에는 Cl–Cl 결합 엔탈피가 포함된다.
    - true
    - $\Delta H_2$ = Cl–Cl 결합 해리 + 2×(Cl의 전자 친화 과정). 결합을 끊는 단계가 들어 있어요.
  - - $\Delta H_1$은 M의 제1 이온화 에너지의 2배와 같다.
    - false
    - $\Delta H_1$에는 M(s)→M(g) 승화 엔탈피도 들어가요. 이온화 에너지만으로는 부족해요.
  - - M이 Na일 때가 K일 때보다 $|\Delta H_3|$가 크다.
    - true
    - $\Delta H_3$는 격자 형성 단계예요. Na⁺가 K⁺보다 작아 이온 사이 거리가 짧으니 격자 에너지가 커요.
  ex: MCl(s)의 표준 생성 엔탈피는 $\dfrac{\Delta H_1+\Delta H_2+\Delta H_3}{2}$예요(2 mol 기준 경로이므로 2로 나눠요).
  ref:
  - co:3
- id: co02
  u: 반응엔탈피·헤스
  t: num
  lv: 2
  q: 25 ℃ 표준 상태에서 $\mathrm{C_3H_8}(g)$의 표준 생성 엔탈피는 −104 kJ/mol, 표준 연소 엔탈피는 −2220 kJ/mol이고, $\mathrm{CO_2}(g)$의 표준 생성 엔탈피는 −394 kJ/mol이다. $\mathrm{H_2O}(l)$의 표준 생성 엔탈피는 몇 kJ/mol인가?
  a: -285.5
  tol: 0.005
  unit: kJ/mol
  ex: '$\mathrm{C_3H_8}+5\mathrm{O_2}\to3\mathrm{CO_2}+4\mathrm{H_2O}(l)$: $-2220=3(-394)+4x-(-104)$ → $4x=-1142$ → $x=-285.5$ kJ/mol. 엔탈피 도표에서 "원소 → 화합물 → 연소 생성물"을 한 바퀴 도는 것과 같아요.'
  ref:
  - co:3
- id: co03
  u: 반응엔탈피·헤스
  t: mc
  lv: 3
  q: '다음은 25 ℃, 1 atm에서의 열화학 반응식이다.

    (가) $\mathrm{H_2}(g)+\tfrac12\mathrm{O_2}(g)\to\mathrm{H_2O}(l)$  $\Delta H_1$

    (나) $2\mathrm{H_2}(g)+\mathrm{O_2}(g)\to2\mathrm{H_2O}(g)$  $\Delta H_2$, 내부 에너지 변화 $\Delta U$

    (다) $3\mathrm{H_2}(g)+\mathrm{O_3}(g)\to3\mathrm{H_2O}(g)$  $\Delta H_3$'
  bg:
  - - $\mathrm{H_2O}(l)$의 표준 증발 엔탈피는 $\tfrac12\Delta H_2-\Delta H_1$이다.
    - true
    - $\mathrm{H_2O}(l)\to\mathrm{H_2O}(g)$ = ½(나) − (가).
  - - $\mathrm{O_3}(g)$의 표준 생성 엔탈피는 $\tfrac32\Delta H_2-\Delta H_3$이다.
    - true
    - $\tfrac32$(나) − (다) 하면 $\tfrac32\mathrm{O_2}\to\mathrm{O_3}$가 남아요.
  - - (나)에서 $|\Delta H_2|<|\Delta U|$이다.
    - false
    - $\Delta H=\Delta U+\Delta n_gRT$, $\Delta n_g=2-3=-1$ → $\Delta H_2=\Delta U-RT$로 더 음수예요. $|\Delta H_2|>|\Delta U|$.
  ref:
  - co:4
- id: co04
  u: 반응엔탈피·헤스
  t: num
  lv: 2
  q: 25 ℃에서 $\mathrm{NO}(g)$, $\mathrm{NO_2}(g)$, $\mathrm{N_2O_4}(g)$의 표준 생성 엔탈피는 각각 +90, +33, +9 kJ/mol이다. $\mathrm{N_2O_4}(g)\to2\mathrm{NO}(g)+\mathrm{O_2}(g)$의 표준 반응 엔탈피는 몇 kJ인가?
  a: 171
  tol: 0.005
  unit: kJ
  ex: $\Delta H^\circ=2(90)+0-9=171$ kJ. 원소 상태(N₂+2O₂)를 기준선으로 놓고 각 물질의 높이를 읽는 엔탈피 도표 방식이에요.
  ref:
  - co:4
- id: co05
  u: 반응엔탈피·헤스
  t: set
  lv: 3
  q: 25 ℃에서 $\mathrm{C_2H_2}(g)$와 $\mathrm{C_6H_6}(g)$의 표준 생성 엔탈피는 각각 227, 83 kJ/mol이고, $\mathrm{C_6H_6}(g)$의 표준 연소 엔탈피는 −3302 kJ/mol이다. 반응 $3\mathrm{C_2H_2}(g)\to\mathrm{C_6H_6}(g)$에 대해 답하시오. (단, $R=8.314$ J/mol·K) [8점]
  parts:
  - p: 이 반응의 $\Delta H^\circ$는 몇 kJ인가?
    t: num
    a: -598
    tol: 0.005
    unit: kJ
    pt: 2
    sol: $\Delta H^\circ=83-3(227)=-598$ kJ.
  - p: 이 반응의 $\Delta U^\circ$는 약 몇 kJ인가?
    t: num
    a: -593.0
    tol: 0.003
    unit: kJ
    pt: 3
    sol: $\Delta n_g=1-3=-2$ → $\Delta U=\Delta H-\Delta n_gRT=-598+2(8.314)(298)/1000\approx-593.0$ kJ. 기체 수가 줄어 주위가 계에 일을 해 주므로 $|\Delta U|<|\Delta H|$예요.
  - p: $\mathrm{C_2H_2}(g)$의 표준 연소 엔탈피는 몇 kJ/mol인가?
    t: num
    a: -1300
    tol: 0.003
    unit: kJ/mol
    pt: 3
    sol: $3\Delta H_c(\mathrm{C_2H_2})=\Delta H^\circ+\Delta H_c(\mathrm{C_6H_6})=-598-3302=-3900$ → $-1300$ kJ/mol.
  ref:
  - co:5
- id: co06
  u: 열량계
  t: set
  lv: 3
  q: 일정 부피 열량계에서 다음 실험을 하였다. (가) 연소열이 4 kJ/g인 물질 X 1.5 g을 연소시키니 온도가 1.0 ℃ 올랐다. (나) 물질 Y(분자량 32) 1 g을 연소시키니 온도가 3.0 ℃ 올랐다. (다) X와 Y의 혼합물 1 g을 연소시키니 온도가 1.6 ℃ 올랐다. [7점]
  parts:
  - p: 열량계의 열용량은 몇 kJ/℃인가?
    t: num
    a: 6
    tol: 0.005
    unit: kJ/℃
    pt: 2
    sol: $C=\dfrac{4\times1.5}{1.0}=6$ kJ/℃.
  - p: Y의 연소에서 $\Delta U$는 몇 kJ/mol인가?
    t: num
    a: -576
    tol: 0.005
    unit: kJ/mol
    pt: 2
    sol: 1 g당 $6\times3.0=18$ kJ 방출 → $\Delta U=-18\times32=-576$ kJ/mol. 일정 부피 열량계는 $q_V=\Delta U$를 재요(ΔH가 아님).
  - p: (다)의 혼합물에서 Y의 질량 백분율은 몇 %인가?
    t: num
    a: 40
    tol: 0.01
    unit: '%'
    pt: 3
    sol: 방출열 $6\times1.6=9.6$ kJ. Y를 $m$ g이라 하면 $4(1-m)+18m=9.6$ → $m=0.4$ → 40 %.
  ref:
  - co:5
- id: co07
  u: 열량계
  t: num
  lv: 3
  q: 0 ℃, 1 atm의 단열 용기에 $\mathrm{H_2O}(s)$ 1 mol과 $\mathrm{H_2O}(l)$ $x$ g의 혼합물이 있다. 여기에 Na(s) 0.25 mol을 넣었더니 반응 $2\mathrm{Na}(s)+2\mathrm{H_2O}(l)\to2\mathrm{NaOH}(aq)+\mathrm{H_2}(g)$ $\Delta H^\circ=-368$ kJ이 완결되고 최종 온도가 25 ℃가 되었다. 얼음의 융해열은 6.0 kJ/mol, 반응 후 혼합물의 비열은 4 J/g·K이다. $x$는 몇 g인가? (단, 반응 후 혼합물의 질량은 처음 넣은 물(얼음 포함)의 질량과 같다고 본다.)
  a: 382
  tol: 0.005
  unit: g
  ex: '방출열 $0.25\times\tfrac{368}{2}=46$ kJ. 얼음 1 mol을 녹이는 데 6 kJ → 남은 40 kJ로 혼합물을 25 K 올림: $40000=m(4)(25)$ → $m=400$ g → $x=400-18=382$ g. "상변화 먼저, 그다음 온도 상승" 순서로 열을 나눠 쓰는 게 핵심이에요.'
  ref:
  - co:6
- id: co08
  u: 반응엔탈피·헤스
  t: set
  lv: 2
  q: '실리콘과 관련된 열화학 자료이다.

    ① $\mathrm{SiO_2}(s)+2\mathrm{C}(s,흑연)\to\mathrm{Si}(s)+2\mathrm{CO}(g)$  $\Delta H^\circ=+690$ kJ

    ② $\mathrm{Si}(s)+2\mathrm{Cl_2}(g)\to\mathrm{SiCl_4}(g)$  $\Delta H^\circ=-657$ kJ

    ③ $\mathrm{SiCl_4}(g)+2\mathrm{Mg}(s)\to2\mathrm{MgCl_2}(s)+\mathrm{Si}(s)$  $\Delta H^\circ=-625$ kJ

    (단, $\mathrm{CO}(g)$의 표준 생성 엔탈피는 −110.5 kJ/mol) [7점]'
  parts:
  - p: ①+②+③ 전체 반응 $\mathrm{SiO_2}+2\mathrm{C}+2\mathrm{Cl_2}+2\mathrm{Mg}\to2\mathrm{CO}+2\mathrm{MgCl_2}+\mathrm{Si}$의 $\Delta H^\circ$는 몇 kJ인가?
    t: num
    a: -592
    tol: 0.003
    unit: kJ
    pt: 2
    sol: $690-657-625=-592$ kJ (헤스 법칙).
  - p: $\mathrm{MgCl_2}(s)$의 표준 생성 엔탈피는 몇 kJ/mol인가?
    t: num
    a: -641
    tol: 0.003
    unit: kJ/mol
    pt: 2
    sol: '②에서 $\Delta H_f(\mathrm{SiCl_4})=-657$. ③: $2x-(-657)=-625$ → $x=-641$ kJ/mol.'
  - p: $\mathrm{SiO_2}(s)$의 표준 생성 엔탈피는 몇 kJ/mol인가?
    t: num
    a: -911
    tol: 0.003
    unit: kJ/mol
    pt: 3
    sol: '①: $690=2(-110.5)-\Delta H_f(\mathrm{SiO_2})$ → $\Delta H_f=-221-690=-911$ kJ/mol.'
  ref:
  - co:6
- id: co09
  u: 반응엔탈피·헤스
  t: mc
  lv: 2
  q: 25 ℃ 표준 상태에서 $\mathrm{CO_2}(g)$, $\mathrm{CH_3OH}(g)$, $\mathrm{CH_3OH}(l)$의 표준 생성 엔탈피는 각각 −394, −201, −239 kJ/mol이고, $\mathrm{CH_3OH}(g)$의 표준 연소 엔탈피는 −765 kJ/mol이다.
  bg:
  - - $\mathrm{H_2}(g)$의 표준 연소 엔탈피는 −286 kJ/mol이다.
    - true
    - $-765=-394+2x-(-201)$ → $x=\Delta H_f(\mathrm{H_2O},l)=-286$ = H₂의 연소 엔탈피.
  - - $\mathrm{CH_3OH}(l)$의 몰 증발 엔탈피는 +38 kJ/mol이다.
    - true
    - $-201-(-239)=+38$ kJ/mol.
  - - $\mathrm{CH_3OH}(l)$의 표준 연소 엔탈피는 −765 kJ/mol보다 작다.
    - false
    - '액체가 기체보다 엔탈피가 38 kJ 낮아 연소열이 덜 나와요: −727 kJ/mol (> −765).'
  ref:
  - co:7
- id: co10
  u: 반응엔탈피·헤스
  t: mc
  lv: 3
  q: '$\mathrm{X_2}$($\mathrm{N_2}$ 또는 $\mathrm{O_2}$)에 대해 $\Delta H_1$: $\mathrm{X_2}(g)\to2\mathrm{X}(g)$, $\Delta H_2$: $\mathrm{X}(g)\to\mathrm{X^+}(g)+e^-$, $\Delta H_3$: $\mathrm{X_2}(g)\to\mathrm{X_2^+}(g)+e^-$, $\Delta H_4$: $\mathrm{X_2^+}(g)\to\mathrm{X}(g)+\mathrm{X^+}(g)$이다. 이온화 에너지(kJ/mol)는 N 1402, $\mathrm{N_2}$ 1503, O 1314, $\mathrm{O_2}$ 1164이다.'
  bg:
  - - $\Delta H_1+\Delta H_2=\Delta H_3+\Delta H_4$이다.
    - true
    - 둘 다 $\mathrm{X_2}\to\mathrm{X}+\mathrm{X^+}+e^-$로 가는 경로라 헤스 법칙으로 같아요.
  - - $\mathrm{X_2}$가 $\mathrm{N_2}$이면 $\Delta H_4<\Delta H_1$이다.
    - true
    - $\Delta H_4=\Delta H_1+(\Delta H_2-\Delta H_3)$, N₂는 $\Delta H_3>\Delta H_2$ → $\Delta H_4<\Delta H_1$. N₂⁺는 결합 오비탈 전자를 잃어 결합 차수 3→2.5.
  - - $\mathrm{X_2}$가 $\mathrm{O_2}$이면 $\Delta H_4<\Delta H_1$이다.
    - false
    - O₂는 $\Delta H_3<\Delta H_2$ → $\Delta H_4>\Delta H_1$. O₂⁺는 반결합 π* 전자를 잃어 결합 차수 2→2.5로 오히려 강해져요.
  ref:
  - co:7
- id: co11
  u: 깁스 자유에너지
  t: set
  lv: 3
  q: '아세트산 합성 반응 $\mathrm{CH_3OH}(l)+\mathrm{CO}(g)\rightleftarrows\mathrm{CH_3COOH}(l)$에 대한 자료이다. 표준 생성 엔탈피(kJ/mol): $\mathrm{CH_3OH}(l)$ −239, $\mathrm{CO}(g)$ −110.5, $\mathrm{CH_3COOH}(l)$ −484. 표준 몰 엔트로피(J/mol·K): 127, 198, 160. (단, $\Delta H^\circ$, $\Delta S^\circ$는 온도에 무관) [8점]'
  parts:
  - p: $\Delta H^\circ$는 몇 kJ인가?
    t: num
    a: -134.5
    tol: 0.003
    unit: kJ
    pt: 2
    sol: $-484-(-239)-(-110.5)=-134.5$ kJ.
  - p: $\Delta S^\circ$는 몇 J/K인가?
    t: num
    a: -165
    tol: 0.003
    unit: J/K
    pt: 2
    sol: $160-127-198=-165$ J/K (기체 1 mol이 사라져 감소).
  - p: 298 K에서 $\Delta G^\circ$는 약 몇 kJ인가?
    t: num
    a: -85.3
    tol: 0.005
    unit: kJ
    pt: 2
    sol: $-134.5-298(-0.165)\approx-85.3$ kJ.
  - p: 정반응이 자발적인 최고 온도는 약 몇 K인가?
    t: num
    a: 815
    tol: 0.005
    unit: K
    pt: 2
    sol: $\Delta H<0$, $\Delta S<0$이면 저온에서 자발. $T=\dfrac{134.5}{0.165}\approx815$ K 미만에서 자발적이에요.
  ref:
  - co:8
- id: co12
  u: 깁스 자유에너지
  t: set
  lv: 3
  q: 300 K 표준 상태에서 $2\mathrm{N_2O_5}(s)\rightleftarrows4\mathrm{NO_2}(g)+\mathrm{O_2}(g)$  $\Delta H^\circ=+218$ kJ이다. 표준 몰 엔트로피(J/mol·K)는 $\mathrm{N_2O_5}(s)$ 178, $\mathrm{NO_2}(g)$ 240, $\mathrm{O_2}(g)$ 205이다. ($R=8.314$ J/mol·K) [8점]
  parts:
  - p: $\Delta U^\circ$는 약 몇 kJ인가?
    t: num
    a: 205.5
    tol: 0.003
    unit: kJ
    pt: 2
    sol: $\Delta n_g=5$ → $\Delta U=218-5(8.314)(300)/1000\approx205.5$ kJ.
  - p: $\Delta S^\circ_{계}$는 몇 J/K인가?
    t: num
    a: 809
    tol: 0.003
    unit: J/K
    pt: 2
    sol: $4(240)+205-2(178)=809$ J/K.
  - p: $\Delta G^\circ$는 약 몇 kJ인가?
    t: num
    a: -24.7
    tol: 0.01
    unit: kJ
    pt: 2
    sol: $218-300(0.809)\approx-24.7$ kJ → 300 K에서 정반응 자발(흡열이지만 엔트로피가 크게 증가).
  - p: 정반응이 일어날 때 주위의 엔트로피 변화는 약 몇 J/K인가?
    t: num
    a: -727
    tol: 0.005
    unit: J/K
    pt: 2
    sol: $\Delta S_{주위}=-\Delta H/T=-218000/300\approx-727$ J/K. 우주 엔트로피 = 809−727 = +82 J/K > 0으로 자발성과 일치해요.
  ref:
  - co:9
- id: co13
  u: 엔트로피·제2법칙
  t: set
  lv: 3
  q: 300 K 표준 상태에서 $4\mathrm{A}(g)+7\mathrm{B}(g)\to4\mathrm{C}(g)+6\mathrm{D}(l)$  $\Delta H^\circ=-1400$ kJ이다. 표준 생성 엔탈피(kJ/mol)는 A −46, B 0, C $a$, D −286이고, 표준 몰 엔트로피(J/mol·K)는 A 192, B 205, C 240, D 70이다. [8점]
  parts:
  - p: $a$는 얼마인가?
    t: num
    a: 33
    tol: 0.01
    unit: kJ/mol
    pt: 2
    sol: $-1400=4a+6(-286)-4(-46)$ → $4a=132$ → $a=33$. (실제로 4NH₃+7O₂→4NO₂+6H₂O 반응이에요.)
  - p: $\Delta S^\circ_{계}$는 몇 J/K인가?
    t: num
    a: -823
    tol: 0.003
    unit: J/K
    pt: 2
    sol: $4(240)+6(70)-4(192)-7(205)=-823$ J/K.
  - p: $\Delta S_{주위}$는 약 몇 J/K인가?
    t: num
    a: 4667
    tol: 0.003
    unit: J/K
    pt: 2
    sol: $-\Delta H/T=1400000/300\approx4667$ J/K.
  - p: 이 반응이 300 K에서 자발적인지 엔트로피로 판단하여 서술하시오.
    t: essay
    pt: 2
    kp:
    - $\Delta S_{우주}=\Delta S_{계}+\Delta S_{주위}=-823+4667>0$
    - 계의 엔트로피는 감소하지만 주위 엔트로피 증가가 더 커서 자발적
    - $|\Delta S_{계}|<|\Delta S_{주위}|$
    sol: $\Delta S_{우주}=-823+4667\approx+3844$ J/K > 0이므로 자발적이다. 계의 엔트로피는 줄지만 큰 발열로 주위 엔트로피가 더 크게 늘기 때문이다.
  ref:
  - co:10
- id: co14
  u: 깁스 자유에너지
  t: mc
  lv: 2
  q: 300 K 표준 상태에서 $\mathrm{S}(s)+3\mathrm{F_2}(g)\to\mathrm{SF_6}(g)$ 반응의 $\Delta G^\circ=-1115$ kJ, $\Delta S^\circ=-349$ J/K이다. S(s)는 300 K, 1 atm에서 가장 안정한 황의 고체상이다.
  bg:
  - - S(s)의 표준 몰 엔트로피는 0이다.
    - false
    - 홑원소 물질의 표준 생성 엔탈피·자유에너지가 0일 뿐, 절대 엔트로피 $S^\circ$는 0 K가 아니면 0보다 커요.
  - - $\mathrm{SF_6}(g)$의 표준 생성 자유에너지는 −1115 kJ/mol이다.
    - true
    - 반응물이 모두 표준 상태의 홑원소 → 이 반응의 $\Delta G^\circ$ = 생성 자유에너지.
  - - 이 반응의 $|\Delta H^\circ|$는 1115보다 크다.
    - true
    - $\Delta H=\Delta G+T\Delta S=-1115+300(-0.349)\approx-1220$ kJ → |ΔH| > 1115.
  ref:
  - co:11
- id: co15
  u: 깁스 자유에너지
  t: set
  lv: 3
  q: 고온에서 $\mathrm{CO}(g)\rightleftarrows\mathrm{C}(g)+\mathrm{O}(g)$  $\Delta H^\circ=1.08\times10^3$ kJ/mol, $\Delta S^\circ=120$ J/mol·K이다. ($N_A=6.02\times10^{23}$, $\Delta H$, $\Delta S$는 온도에 무관) [6점]
  parts:
  - p: 정반응이 자발적으로 되기 시작하는 온도는 몇 K인가?
    t: num
    a: 9000
    tol: 0.005
    unit: K
    pt: 2
    sol: $T=\Delta H/\Delta S=1080/0.120=9000$ K 이상에서 자발적.
  - p: 일정 압력에서 CO 분자 1개의 결합을 끊는 데 필요한 열은 약 몇 ×10⁻¹⁸ J인가?
    t: num
    a: 1.79
    tol: 0.01
    unit: ×10⁻¹⁸ J
    pt: 2
    sol: $1.08\times10^6/6.02\times10^{23}\approx1.79\times10^{-18}$ J.
  - p: CO 1몰이 분해될 때 $\Delta U$는 $\Delta H$보다 큰가 작은가? (크다/작다)
    t: txt
    a:
    - 작다
    - 작음
    pt: 2
    sol: $\Delta n_g=+1$ → $\Delta U=\Delta H-RT<\Delta H$. 기체가 늘며 외부에 팽창 일을 하므로 내부 에너지 증가분은 더 작아요.
  ref:
  - co:11
- id: co16
  u: 자발성
  t: num
  lv: 3
  q: 25 ℃ 표준 상태에서 (가) $2\mathrm{C_3H_6O_3}(aq)\to\mathrm{C_6H_{12}O_6}(aq)$ 반응을 ATP 가수분해 $\mathrm{ATP}+\mathrm{H_2O}\to\mathrm{ADP}+\mathrm{P_i}$ ($\Delta G^\circ=-30.5$ kJ)와 짝지어 일으키려 한다. 표준 생성 자유에너지는 $\mathrm{C_3H_6O_3}(aq)$ −517 kJ/mol, $\mathrm{C_6H_{12}O_6}(aq)$ −917 kJ/mol이다. 포도당 1 mol을 만드는 데 필요한 ATP는 최소 몇 mol인가? (정수)
  a: 4
  tol: 0
  unit: mol
  ex: (가)의 $\Delta G^\circ=-917-2(-517)=+117$ kJ(비자발). 짝지은 반응의 $\Delta G<0$이려면 $30.5n>117$ → $n>3.84$ → 최소 4 mol (젖산 1 mol당 2 mol).
  ref:
  - co:12
- id: co17
  u: 자발성
  t: mc
  lv: 3
  q: 온도 $T$에서 $\mathrm{CO_2}(g)+\mathrm{MCO_3}(s)+\mathrm{H_2O}(l)\rightleftarrows\mathrm{M^{2+}}(aq)+2\mathrm{HCO_3^-}(aq)$의 평형 상수 $K=20$이고, 온도를 높이면 $K$가 감소한다. 이 반응의 $\Delta S^\circ<0$이다. (M은 임의의 원소, $\Delta H^\circ$, $\Delta S^\circ$는 온도에 무관)
  bg:
  - - 온도 $T$에서 $\Delta G^\circ<0$이다.
    - true
    - $\Delta G^\circ=-RT\ln K$, $K=20>1$ → 음수.
  - - 정반응은 발열 반응이다.
    - true
    - 온도를 높일 때 K가 감소하면 정반응은 발열($\Delta H^\circ<0$)이에요(르샤틀리에·반트호프).
  - - 온도를 높이면 정반응의 $\Delta G^\circ$는 커진다.
    - true
    - $\Delta G^\circ=\Delta H^\circ-T\Delta S^\circ$에서 $\Delta S^\circ<0$이라 $-T\Delta S^\circ$가 커져요. 결국 $T>\Delta H^\circ/\Delta S^\circ$가 되면 비자발적이 돼요.
  ref:
  - co:13
- id: co18
  u: 상평형
  t: mc
  lv: 3
  q: 물질 X의 삼중점은 217 K, 5.1 atm이고, 1 atm에서의 승화점은 195 K이다. 1 atm에서 고체 X 1 mol에 일정한 세기로 열을 가했더니 온도가 오르다가 A점(열 공급 35 cal)부터 B점(85 cal)까지 온도가 $T$로 일정했고, 그 뒤 다시 올랐다. B 이후 구간의 기울기가 A 이전 구간보다 가팔랐다. 이에 대한 설명으로 옳은 것은?
  c:
  - A→B 과정에서 계의 자유 에너지 변화($\Delta G$)는 0이다.
  - $T$는 217 K이다.
  - A→B 과정에서 계의 엔트로피 변화는 $\dfrac{50}{217}$ cal/K이다.
  - 가열 도중 액체 상태를 거친다.
  - 몰 열용량은 X(g)가 X(s)보다 크다.
  a: 0
  cx:
  - 일정한 T, P에서 두 상이 평형을 이루며 상변화하므로 $\Delta G=0$이에요.
  - 1 atm은 삼중점 압력(5.1 atm)보다 낮아 액체 없이 195 K에서 승화해요. $T$=195 K.
  - $\Delta S=q/T=50/195$ cal/K예요. 217이 아니에요.
  - 삼중점보다 낮은 압력이라 고체→기체로 바로 승화해요.
  - 같은 세기로 가열할 때 기울기가 가파를수록 열용량이 작아요 → 기체 쪽이 더 작아요.
  ex: '"삼중점 압력보다 낮은 1 atm → 승화", "평형 상변화 → ΔG = 0, ΔS = ΔH/T"가 핵심이에요(CO₂ 드라이아이스와 같은 경우).'
  ref:
  - co:13
- id: co19
  u: 상평형
  t: mc
  lv: 3
  q: A의 정상 녹는점에서 $\mathrm{A}(s)\rightleftarrows\mathrm{A}(l)$  $\Delta H^\circ=a$, $\Delta S^\circ=b$이다. 온도 $T_1$의 실린더에 A(l) 1 mol을 넣고(가, $T_1$은 A의 녹는점보다 높다) 온도를 $T_2$로 하였더니 A(l) 0.5 mol과 A(s) 0.5 mol이 평형을 이루었다(나). (가)→(나)에서 계가 주위로 방출한 열은 20 kJ이다. (압력은 1 atm으로 일정)
  bg:
  - - $T_1>T_2$이다.
    - true
    - $T_1$은 녹는점보다 높고, (나)는 고체·액체가 공존하는 평형이므로 $T_2$ = 녹는점 → $T_1>T_2$.
  - - $a=40$ kJ/mol이다.
    - false
    - 방출열 20 kJ에는 액체를 $T_1$→$T_2$로 식히는 열도 들어 있어요. 0.5 mol이 얼며 낸 열은 20 kJ보다 작으니 $a<40$.
  - - (나)에서 A(s)와 A(l)의 1몰당 자유에너지는 같다.
    - true
    - 두 상이 평형이면 몰 자유에너지(화학 퍼텐셜)가 같아요. 또 $b=a/T_2$.
  ref:
  - co:14
- id: co20
  u: 깁스 자유에너지
  t: set
  lv: 3
  q: $\mathrm{A}(g)\rightleftarrows\mathrm{B}(g)$  $\Delta H^\circ$ 반응이 (가) 300 K에서 A 1.0 atm, B 3.0 atm으로, (나) 450 K에서 A 1.5 atm, B 1.5 atm으로 평형을 이루었다. ($R=8.314$ J/mol·K, $\Delta H^\circ$, $\Delta S^\circ$는 온도에 무관) [8점]
  parts:
  - p: $\Delta H^\circ$는 약 몇 kJ인가?
    t: num
    a: -8.22
    tol: 0.01
    unit: kJ
    pt: 3
    sol: $K_1=3$, $K_2=1$. $\ln\dfrac{K_2}{K_1}=-\dfrac{\Delta H}{R}\left(\dfrac1{T_2}-\dfrac1{T_1}\right)$ → $-\ln3=\dfrac{\Delta H}{900R}$ → $\Delta H=-900R\ln3\approx-8.22$ kJ.
  - p: $\Delta S^\circ$는 약 몇 J/K인가?
    t: num
    a: -18.3
    tol: 0.01
    unit: J/K
    pt: 3
    sol: 450 K에서 $K=1$ → $\Delta G^\circ=0$ → $\Delta S^\circ=\Delta H^\circ/450\approx-18.3$ J/K. 그래서 1몰당 $S^\circ$는 A가 B보다 커요.
  - p: (가)와 (나)에서 정반응의 $\Delta G$(표준이 아닌 실제 값)는 각각 얼마인가? 이유와 함께 쓰시오.
    t: essay
    pt: 2
    kp:
    - 평형 상태에서는 $\Delta G=0$
    - (가), (나) 모두 0
    - '$\Delta G^\circ$와 $\Delta G$를 구분: $\Delta G^\circ=-RT\ln K$는 온도마다 다름'
    sol: 두 상태 모두 평형이므로 $\Delta G=\Delta G^\circ+RT\ln Q=0$이다. 반면 $\Delta G^\circ=-RT\ln K$는 (가)에서 $-RT\ln3<0$, (나)에서 0으로 다르다.
  ref:
  - co:15
- id: co21
  u: 이상기체 과정
  t: mc
  lv: 3
  q: 부피 $V$ 플라스크의 He 1 mol을 콕을 열어 부피 $2V$의 진공 실린더로 퍼지게 하여 전체 $3V$에서 평형에 도달시킨 뒤(과정 1), 피스톤으로 가역적으로 눌러 전체 부피를 다시 $V$로 만들었다(과정 2). 전 과정에서 온도는 $T$로 일정하고 He은 이상 기체이다.
  bg:
  - - 과정 1에서 기체가 한 일은 0이다.
    - true
    - 진공으로의 자유 팽창이라 $P_{ext}=0$ → $w=0$, 등온이라 $q=0$.
  - - 과정 2에서 기체가 받은 일은 $RT\ln3$이다.
    - true
    - '가역 등온 압축 $3V\to V$: $w=-nRT\ln\dfrac{V}{3V}=RT\ln3$ (기체가 받은 일). 같은 크기의 열을 방출해요.'
  - - $\Delta G_1+\Delta G_2>0$이다.
    - false
    - 처음과 끝 상태(T, V 같음)가 같아 상태함수 G의 변화 합은 0이에요. $\Delta G_1=-RT\ln3$, $\Delta G_2=+RT\ln3$.
  ref:
  - co:15
- id: co22
  u: 반응엔탈피·헤스
  t: mc
  lv: 3
  q: 25 ℃ 표준 상태에서 표준 생성 엔탈피(kJ/mol)가 Mg(g) $a$, Mg²⁺(g) $b$, O(g) $c$, H(g) $d$, OH⁻(g) $e$, Mg(OH)₂(s) $f$일 때, $\mathrm{Mg^{2+}}(g)+2\mathrm{OH^-}(g)\to\mathrm{Mg(OH)_2}(s)$의 반응 엔탈피(격자 형성 엔탈피)는?
  c:
  - $f-b-2e$
  - $f-b-e$
  - $b+2e-f$
  - $f-a-b-2e$
  - $f-b-2c-2d$
  a: 0
  cx:
  - '생성 엔탈피 공식 "생성물 − 반응물" 그대로: $f-(b+2e)$예요.'
  - OH⁻가 2 mol이라 $e$에 2를 곱해야 해요.
  - 부호가 반대예요(격자 형성은 큰 발열, 음수).
  - Mg²⁺(g)의 생성 엔탈피 $b$에 이미 Mg(s)→Mg(g) 승화($a$)가 포함돼 있어 또 빼면 중복이에요.
  - OH⁻(g)의 생성 엔탈피는 $e$로 주어졌어요. O, H 원자로 쪼갤 필요 없어요.
  ex: 내 필기처럼 화살표 그림을 그려 보면 Mg(s)+O₂+H₂ → (b, 2e) → Mg²⁺(g)+2OH⁻(g) → Mg(OH)₂(s) 경로가 생성 엔탈피 $f$와 같아요.
  ref:
  - co:2
- id: ch01
  u: 이상기체 과정
  t: set
  lv: 3
  q: 단원자 분자 이상 기체 1 mol이 A($P_0$, $2V_0$, 절대 온도 $T_0$)에서 부피 일정하게 압력이 $3P_0$가 된 뒤, 압력 일정하게 부피 $4V_0$인 B가 되었다. 답은 $RT_0$의 몇 배인지로 쓰시오. [7점]
  parts:
  - p: A→B에서 내부 에너지 변화는 $RT_0$의 몇 배인가?
    t: num
    a: 7.5
    tol: 0.01
    unit: ×RT₀
    pt: 2
    sol: '$2P_0V_0=RT_0$. B: $3P_0\cdot4V_0=12P_0V_0=6RT_0$ → $T_B=6T_0$. $\Delta U=\tfrac32R(5T_0)=7.5RT_0$.'
  - p: 기체가 한 일은 $RT_0$의 몇 배인가?
    t: num
    a: 3
    tol: 0.01
    unit: ×RT₀
    pt: 2
    sol: 정적 구간은 일 0, 정압 구간 $3P_0\times2V_0=6P_0V_0=3RT_0$.
  - p: 기체가 흡수한 열은 $RT_0$의 몇 배인가?
    t: num
    a: 10.5
    tol: 0.01
    unit: ×RT₀
    pt: 3
    sol: $q=\Delta U+W_{기체}=7.5+3=10.5\,RT_0$. (P–V 그래프에서 "일 = 넓이"와 "$\Delta U=\tfrac32\Delta(PV)$"를 같이 쓰면 빨라요.)
  ref:
  - ch:2
- id: ch02
  u: 이상기체 과정
  t: mc
  lv: 3
  q: 일정량의 단원자 이상 기체가 압력–온도 그래프에서 A($P$, $T$), B($2P$, $T$), C($2P$, $2T$), D($P$, $2T$)인 상태 사이를 A→B→C, A→C(직선), A→D→C 세 경로로 변한다.
  bg:
  - - A→C 과정에서 기체가 흡수한 열량은 내부 에너지 변화량과 같다.
    - true
    - P와 T가 같은 비율로 커지는 직선 → $V=nRT/P$ 일정(정적) → $w=0$, $q=\Delta U$.
  - - 기체가 방출한 열량은 A→B 과정이 D→C 과정보다 크다.
    - false
    - '둘 다 부피가 절반이 되는 등온 압축: A→B $nRT\ln2$, D→C $2nRT\ln2$ → D→C가 더 커요.'
  - - 기체가 한 일은 A→D 과정과 B→C 과정에서 같다.
    - true
    - 'A→D: $P(2V-V)=PV$, B→C: $2P(V-\tfrac V2)=PV$로 같아요.'
  ref:
  - ch:2
- id: ch03
  u: 엔트로피·제2법칙
  t: set
  lv: 3
  q: 단원자 이상 기체 $\tfrac14$ mol의 가역 순환 과정이 온도–엔트로피 그래프에서 A(400 K, 5 J/K) → B(400 K, 7 J/K) → C(300 K, 7 J/K) → A(직선)로 나타난다. ($R=8$ J/mol·K) [8점]
  parts:
  - p: A→B 과정에서 기체가 흡수한 열은 몇 J인가?
    t: num
    a: 800
    tol: 0.005
    unit: J
    pt: 2
    sol: '등온 가역: $q=T\Delta S=400\times2=800$ J (이 값이 기체가 한 일과 같아요).'
  - p: B→C 과정의 내부 에너지 변화는 몇 J인가?
    t: num
    a: -300
    tol: 0.005
    unit: J
    pt: 2
    sol: S 일정 = 가역 단열. $\Delta U=\tfrac32nR\Delta T=\tfrac32\cdot\tfrac14\cdot8\cdot(-100)=-300$ J.
  - p: B의 부피는 A의 부피의 몇 배인가? (소수 둘째 자리까지)
    t: num
    a: 2.72
    tol: 0.01
    unit: 배
    pt: 2
    sol: '등온: $\Delta S=nR\ln\dfrac{V_B}{V_A}$ → $2=2\ln\dfrac{V_B}{V_A}$ → $e\approx2.72$배.'
  - p: 한 순환 동안 기체가 외부에 한 알짜 일은 몇 J인가?
    t: num
    a: 100
    tol: 0.005
    unit: J
    pt: 2
    sol: 'T–S 폐곡선 넓이 = 알짜 열 = 알짜 일: $\tfrac12\times2\times100=100$ J (시계 방향이라 양수).'
  ref:
  - ch:5
- id: ch04
  u: 이상기체 과정
  t: mc
  lv: 3
  q: 단원자 이상 기체 1 mol이 A($P_0$, $V_0$, $T_0$)에서 부피 $3V_0$까지 세 경로로 팽창한다. A→B는 등압, A→C는 등온, A→D는 가역 단열 과정이다. (기체 상수 $R$)
  bg:
  - - A→B 과정에서 기체가 한 일은 $2RT_0$이다.
    - true
    - $P_0(3V_0-V_0)=2P_0V_0=2RT_0$.
  - - A→C 과정에서 기체가 한 일은 $RT_0\ln3$이다.
    - true
    - 등온 가역 $nRT\ln\dfrac{V_2}{V_1}=RT_0\ln3$.
  - - A→D 과정에서 기체가 흡수한 열은 $RT_0\ln3$이다.
    - false
    - 단열 과정은 $q=0$이에요. 기체가 한 일은 내부 에너지 감소량과 같아요. (D의 압력은 $3^{-5/3}P_0\approx0.16P_0$로 $P_0/6$보다 작아요.)
  ref:
  - ch:7
- id: ch05
  u: 카르노
  t: mc
  lv: 3
  q: 어느 열기관의 순환 과정이 T–S 도표에서 a→b(엔트로피 일정, 온도 증가), b→c(부피 일정, 온도 증가), c→d(엔트로피 일정, 온도 감소), d→a(부피 일정, 온도 감소)로 나타난다. (기체는 이상 기체)
  bg:
  - - a→b 과정에서 기체의 부피는 감소한다.
    - true
    - S 일정 = 가역 단열. 단열 과정에서 온도가 오르려면 압축되어야 해요.
  - - d→a 과정에서 기체는 열을 흡수한다.
    - false
    - 정적 과정에서 온도가 내려가면 $\Delta U<0$, $w=0$ → 열을 방출해요(T–S에서 S도 감소).
  - - T–S 그래프 폐곡선 내부의 넓이는 한 순환 동안 기체가 한 알짜 일과 같다.
    - true
    - $\oint T\,dS=q_{알짜}$이고 순환에서 $\Delta U=0$이라 알짜 열 = 알짜 일이에요.
  ex: '이 순환은 오토(Otto) 기관과 같은 모양이에요: 단열 압축 → 정적 가열 → 단열 팽창 → 정적 냉각.'
  ref:
  - ch:7
- id: cn01
  u: 반응엔탈피·헤스
  t: mc
  lv: 1
  q: 발열 반응에 대한 설명으로 옳지 않은 것은?
  c:
  - 항상 자발적으로 일어난다.
  - 계가 주위로 열을 방출하고 $\Delta H<0$이다.
  - 반응이 일어나면 주위의 엔트로피가 증가한다.
  - 결합 에너지의 합이 반응물보다 생성물이 크다.
  - 생성물의 생성 엔탈피 합이 반응물보다 작다.
  a: 0
  cx:
  - 자발성은 $\Delta G=\Delta H-T\Delta S$로 정해요. $\Delta S<0$이고 고온이면 발열이어도 비자발적일 수 있어요. 그래서 옳지 않아요.
  - 발열의 정의 그대로예요.
  - $\Delta S_{주위}=-\Delta H/T>0$이에요.
  - 생성물이 더 강하게 결합해 있어 결합 형성 때 에너지가 더 많이 나와요.
  - $\Delta H=\Sigma\Delta H_f(생)-\Sigma\Delta H_f(반)<0$이에요.
  ref:
  - cn:3
- id: cn02
  u: 상평형
  t: num
  lv: 3
  q: 물의 몰 증발 엔탈피는 40.7 kJ/mol이고 373 K에서 증기 압력은 1.00 atm이다. 클라우지우스–클라페이롱 식을 이용하면 353 K에서 물의 증기 압력은 약 몇 atm인가? ($R=8.314$ J/mol·K, 증발 엔탈피는 일정)
  a: 0.475
  tol: 0.01
  unit: atm
  ex: '$\ln\dfrac{P}{1}=-\dfrac{\Delta H_{vap}}{R}\left(\dfrac1{353}-\dfrac1{373}\right)=-4895\times1.519\times10^{-4}\approx-0.744$ → $P\approx0.475$ atm. 필기의 유도: $\dfrac{dP}{dT}=\dfrac{\Delta H}{T\Delta V}$, $\Delta V\approx V_g=RT/P$.'
  ref:

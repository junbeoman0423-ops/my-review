  q: 상온에서 이원자 분자 이상 기체 $\mathrm{N_2}$ 2 mol을 일정한 압력에서 10 K 가열하는 데 필요한 열은 약 몇 J인가? (진동은 무시, $R=8.314$ J/mol·K)
  a: 582
  tol: 0.005
  unit: J
  ex: '이원자 분자: 병진 3 + 회전 2 자유도 → $C_V=\tfrac52R$, $C_P=\tfrac72R$. $q_P=nC_P\Delta T=2\times3.5\times8.314\times10\approx582$ J. (단원자라면 $\tfrac52R$로 416 J)'

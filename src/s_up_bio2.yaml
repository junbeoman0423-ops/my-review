  q: '포도당과 젖당이 함께 있는 배지에서 대장균의 포도당 농도가 높을 때 일어나는 일로 옳은 것은? (PTS: 포도당 인산화 운반계, 효소 IIA: PTS의 구성 단백질)'
  c:
  - PTS가 포도당 운반에 인산기를 써서 효소 IIA가 탈인산화되고, 이것이 젖당 투과 효소를 억제해 세포 안 젖당(알로락토오스)이 줄어든다.
  - 효소 IIA가 인산화되어 아데닐산 고리화 효소를 활성화하므로 cAMP가 증가한다.
  - β-갈락토시드 투과 효소가 활성화되어 젖당 유입이 늘어난다.
  - cAMP–CAP 농도가 높아져 lac 오페론 전사가 촉진된다.
  - 포도당이 lac 억제자에 직접 결합해 억제자를 활성화한다.
  a: 0
  cx:
  - '유도 물질 배제(inducer exclusion): 탈인산화 IIA → 투과 효소 억제 → 젖당 유입↓ → 억제자 활성 유지. 동시에 AC 비활성 → cAMP↓. 두 경로로 전사 ✗.'
  - 포도당이 적을 때의 일이에요(IIA 인산화 → AC 활성).
  - 포도당이 많으면 투과 효소가 억제돼요.
  - cAMP가 줄어 cAMP–CAP이 적어져요.
  - 포도당은 억제자에 직접 결합하지 않아요.

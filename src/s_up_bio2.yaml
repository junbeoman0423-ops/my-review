# ===================== 생물 · 내 정리 노트 (나피T 유전자·단백질 · 유전자 발현 조절) =====================
- id: nn01
  u: 유전자와 단백질
  t: mc
  lv: 1
  q: 개로드(Garrod)의 알캅톤뇨증 연구에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?
  bg:
  - - 환자는 호모젠티스산을 분해하지 못해 이 물질이 오줌으로 배출되고, 공기 중에서 산화되어 검게 변한다.
    - true
    - '필기: 호모젠티스산 분해 ✗ → 오줌으로 배출 → 산화되어 검은색.'
  - - 개로드는 특정 효소를 만들지 못하는 것이 대사 장애를 일으키며, 이 장애가 유전된다고 보았다.
    - true
    - '"선천성 대사 이상" 개념 – 1유전자 1효소설보다 앞선 아이디어예요.'
  - - 개로드는 붉은빵곰팡이에 X선을 쪼여 이 사실을 실험으로 증명하였다.
    - false
    - 붉은빵곰팡이 실험은 비들과 테이텀이에요. 개로드는 사람 환자의 가계·대사 연구를 했어요.
  ref:
  - nn:1
- id: nn02
  u: 유전자와 단백질
  t: mc
  lv: 3
  q: 사람 헤모글로빈은 발생 시기에 따라 구성 폴리펩타이드가 바뀐다. 배아기 $\zeta_2\varepsilon_2$, 태아기 $\alpha_2\gamma_2$, 성인 $\alpha_2\beta_2$이며, 각 폴리펩타이드는 서로 다른 유전자가 암호화한다.
  bg:
  - - 태아의 헤모글로빈은 성인의 헤모글로빈보다 산소 친화도가 커서 모체 혈액에서 산소를 받아 올 수 있다.
    - true
    - '필기: 폴리펩타이드에 따라 O₂·CO 친화도가 달라 시기에 맞게 산소를 먼저 받아요.'
  - - α 글로빈 유전자에 기능 상실 돌연변이가 있으면 태아기와 성인의 헤모글로빈이 모두 영향을 받는다.
    - true
    - α 사슬은 태아형(α₂γ₂)과 성인형(α₂β₂)에 공통으로 들어가요.
  - - β 글로빈 유전자 이상(겸형 적혈구)은 태아기 헤모글로빈의 구조를 바꾼다.
    - false
    - 태아기에는 β 대신 γ를 쓰므로 β 이상은 주로 출생 후 성인형 헤모글로빈에서 나타나요.
  ex: 한 단백질이 여러 유전자의 폴리펩타이드로 이루어진다는 점이 1유전자 1폴리펩타이드설의 근거예요.
  ref:
  - nn:1
- id: nn03
  u: 유전자와 단백질
  t: mc
  lv: 2
  q: '"1유전자 1기능분자설"이 등장하게 된 근거로 가장 적절한 것은?'
  c:
  - miRNA, rRNA, tRNA처럼 단백질로 번역되지 않고 RNA 자체로 기능하는 유전자 산물이 발견되었다.
  - 헤모글로빈이 서로 다른 두 종류의 폴리펩타이드로 이루어져 있음이 밝혀졌다.
  - 붉은빵곰팡이의 영양요구성 돌연변이주가 특정 효소만 만들지 못한다는 것이 밝혀졌다.
  - 겸형 적혈구 빈혈증에서 효소가 아닌 단백질의 이상이 확인되었다.
  - 선천성 대사 이상 환자에게서 특정 물질이 오줌으로 배출되는 것이 관찰되었다.
  a: 0
  cx:
  - 유전자의 산물에 기능적 RNA까지 포함시킨 정의라 정답이에요. miRNA는 표적 mRNA에 결합해 분해·번역 억제를 일으켜요.
  - 1유전자 1폴리펩타이드설의 근거예요.
  - 1유전자 1효소설의 근거예요.
  - 1유전자 1단백질설(효소 → 단백질 확장)의 근거예요.
  - 개로드의 선천성 대사 이상 연구로, 가장 초기 단계예요.
  ref:
  - nn:1
- id: nn04
  u: 유전자와 단백질
  t: mc
  lv: 3
  q: 붉은빵곰팡이의 아르지닌 합성 경로는 전구 물질 →(A)→ 오르니틴 →(B)→ 시트룰린 →(C)→ 아르지닌이다. ㉠~㉣은 야생형과 돌연변이주 I(A 결함), II(B 결함), III(C 결함)을 순서 없이 나타낸 것이고, ⓐ~ⓒ는 오르니틴, 시트룰린, 아르지닌을 순서 없이 나타낸 것이다.
  tb: '<table><tr><th>균주</th><th>최소 배지</th><th>+ⓐ</th><th>+ⓑ</th><th>+ⓒ</th></tr><tr><td>㉠</td><td>−</td><td>+</td><td>+</td><td>−</td></tr><tr><td>㉡</td><td>+</td><td>+</td><td>+</td><td>+</td></tr><tr><td>㉢</td><td>−</td><td>−</td><td>+</td><td>−</td></tr><tr><td>㉣</td><td>−</td><td>+</td><td>+</td><td>+</td></tr></table><div class="sub">(+: 생장함, −: 생장 못 함)</div>'
  bg:
  - - ⓑ는 효소 C의 생성물이다.
    - true
    - 모든 균주를 살리는 ⓑ = 최종 산물 아르지닌 = C의 생성물. ㉡은 최소 배지에서 자라니 야생형.
  - - ㉠은 ⓐ가 첨가된 배지에서 아르지닌을 합성한다.
    - true
    - 두 물질로 살아나는 ㉠ = II(B 결함), ⓐ = 시트룰린(ⓒ = 오르니틴). II는 시트룰린을 받으면 C로 아르지닌을 만들어요.
  - - ㉣은 효소 B의 유전자에 돌연변이가 일어난 것이다.
    - false
    - ㉣은 세 물질 모두로 살아나므로 가장 앞 단계 A가 결함인 I이에요. ㉢(아르지닌만) = III.
  ex: '풀이 순서: ① 최소 배지에서 자라는 행 = 야생형 ② 모든 균주를 살리는 열 = 최종 산물 ③ 살리는 물질 수가 많을수록 앞 단계 결함.'
  ref:
  - nn:1
- id: nn05
  u: 중심원리·전사
  t: mc
  lv: 2
  q: RNA의 구조와 진핵세포의 폴리리보솜에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?
  bg:
  - - 단일 가닥 RNA는 자기 상보적인 염기 서열이 있으면 머리핀 같은 2차 구조를 만든다.
    - true
    - '필기: 자기 상보적 구간 → 상보적 염기쌍 → 줄기·고리.'
  - - RNA는 복잡한 3차 구조를 이루어 촉매 역할을 할 수 있다.
    - true
    - 리보자임 – 자가 스플라이싱, 리보솜의 펩타이드 결합 형성.
  - - 원핵세포 mRNA도 5′ 캡과 폴리 A 꼬리가 결합한 원형 구조를 만들어 리보솜이 여러 번 번역한다.
    - false
    - 원형 폴리솜은 5′ 캡–폴리 A 꼬리를 가진 진핵 mRNA의 특징이에요. 원핵은 원형 구조 ✗.
  ref:
  - nn:2
- id: nn06
  u: 발현 조절 기초
  t: mc
  lv: 1
  q: 원핵세포의 유전자와 그 예를 바르게 짝지은 것은?
  c:
  - 구성성 유전자 – rRNA, tRNA, RNA 중합효소 유전자
  - 유도성 유전자 – trp 합성 효소 유전자
  - 억제성 유전자 – lac 오페론의 구조 유전자
  - 구성성 유전자 – 젖당 분해 효소 유전자
  - 유도성 유전자 – 최종 산물이 많을 때 발현이 꺼지는 유전자
  a: 0
  cx:
  - 항상 필요한 하우스키핑 유전자는 지속적으로 발현돼요(구성성).
  - trp는 최종 산물(Trp)이 많으면 꺼지는 억제성이에요.
  - lac은 기질(젖당)이 있을 때 켜지는 유도성이에요.
  - 젖당 분해 효소는 젖당이 있을 때만 필요해 유도성이에요.
  - 최종 산물로 꺼지는 것은 억제성의 정의예요.
  ref:
  - nn:2
- id: nn07
  u: 발현 조절 기초
  t: mc
  lv: 2
  q: 전사 개시에 관여하는 요소에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?
  bg:
  - - 진핵세포의 보편 전사 인자는 핵심 프로모터에 결합한다.
    - true
    - 핵심 프로모터(TATA 상자 등)에 RNA 중합효소 Ⅱ와 함께 결합해요.
  - - 진핵세포의 특수 전사 인자는 핵심 프로모터에 결합하여 세포 종류에 따라 다른 유전자를 발현시킨다.
    - false
    - 특수 전사 인자는 조절 프로모터·인핸서·사일런서에 결합해요. 핵심 프로모터 결합 ✗.
  - - 원핵세포의 σ 인자는 RNA 중합효소와 프로모터의 친화력을 높이고 정확한 프로모터를 찾게 한다.
    - true
    - '필기: ① 친화력↑ ② 정확한 프로모터 확인 → 정확성↑. 진핵은 σ가 없어 전사 인자가 필요해요.'
  ref:
  - nn:2
  - nn:3
- id: nn08
  u: 발현 조절 기초
  t: mc
  lv: 2
  q: '진핵세포에서 RNA 중합효소 Ⅱ에 의한 전사 개시가 일어나는 순서로 옳은 것은?

    ㄱ. 멀리 떨어진 인핸서에 특수 전사 인자(활성자)가 결합한다.

    ㄴ. TATA 상자에 TBP가 결합한 뒤 핵심 프로모터에 RNA 중합효소 Ⅱ와 보편 전사 인자가 결합한다.

    ㄷ. 전사 개시 복합체가 완성되어 전사가 시작된다.

    ㄹ. DNA 굽힘 단백질이 DNA를 접어 특수 전사 인자와 RNA 중합효소를 가까이 모은다.'
  c:
  - ㄴ → ㄱ → ㄹ → ㄷ
  - ㄱ → ㄴ → ㄷ → ㄹ
  - ㄹ → ㄴ → ㄱ → ㄷ
  - ㄴ → ㄹ → ㄷ → ㄱ
  - ㄱ → ㄹ → ㄴ → ㄷ
  a: 0
  cx:
  - '필기 순서 그대로: TBP·RNA pol Ⅱ·보편 전사 인자 → 먼 곳 특수 전사 인자 → DNA 굽힘 → 개시 복합체 → 전사.'
  - 개시 복합체 완성(ㄷ)은 DNA 굽힘(ㄹ) 다음이에요.
  - DNA를 굽히는 것은 결합할 단백질들이 자리를 잡은 뒤예요.
  - 전사가 시작된 뒤에 활성자가 결합하면 개시를 도울 수 없어요.
  - 핵심 프로모터에 기본 장치(ㄴ)가 먼저 있어야 DNA를 굽혀 연결할 대상이 생겨요.
  ref:
  - nn:3
- id: nn09
  u: 발현 조절 기초
  t: set
  lv: 3
  q: '가상의 세균 오페론 X, Y, Z의 조절 방식이다. 각 오페론의 조절 방식을 「유도성/억제성」 + 「양의/음의 조절」로 쓰시오. (예: 유도성 음의 조절) [6점]

    X: 조절 단백질 R은 평소 DNA에 결합하지 않아 전사가 거의 없다. 물질 M이 R에 결합하면 R이 DNA에 결합하고 전사가 크게 일어난다.

    Y: 조절 단백질 Q는 평소 작동 부위에 결합하지 않아 전사가 일어난다. 물질 N이 Q에 결합하면 Q가 작동 부위에 결합해 전사가 멈춘다.

    Z: 조절 단백질 P는 평소 DNA에 결합해 전사를 돕는다. 물질 L이 P에 결합하면 P가 DNA에서 떨어져 전사가 줄어든다.'
  parts:
  - p: X의 조절 방식은?
    t: txt
    a:
    - 유도성 양의 조절
    - 유도성 양성 조절
    - 유도성양의조절
    pt: 2
    sol: 활성자(R)가 효과 물질과 결합해야 DNA에 붙어 전사 ↑ → 유도성 양의 조절 (M = 보조 활성인자, lac의 cAMP–CAP와 같은 방식).
  - p: Y의 조절 방식은?
    t: txt
    a:
    - 억제성 음의 조절
    - 억제성 음성 조절
    - 억제성음의조절
    pt: 2
    sol: 억제자(Q)가 효과 물질(N = 보조 억제인자)과 결합해야 작동 부위에 붙어 전사 ↓ → 억제성 음의 조절 (trp 오페론 방식).
  - p: Z의 조절 방식은?
    t: txt
    a:
    - 억제성 양의 조절
    - 억제성 양성 조절
    - 억제성양의조절
    pt: 2
    sol: 활성자(P)가 평소 결합해 전사 ○, 효과 물질 결합 시 떨어져 전사 ✗ → 억제성 양의 조절.
  ref:
  - nn:3
- id: nn10
  u: 발현 조절 기초
  t: mc
  lv: 2
  q: lac 오페론과 trp 오페론의 조절을 필기의 네 가지 유형으로 분류한 것으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?
  bg:
  - - cAMP–CAP에 의한 lac 오페론 조절은 유도성 양의 조절이다.
    - true
    - CAP(활성자)은 cAMP(보조 활성인자)와 결합해야 DNA에 붙어 전사를 촉진해요.
  - - trp 억제자는 트립토판과 결합하기 전에 작동 부위에 결합해 전사를 막는다.
    - false
    - trp 억제자는 평소 비활성이에요. Trp(보조 억제인자)와 결합해야 작동 부위에 붙어요.
  - - lac 억제자에 의한 조절은 유도성 음의 조절이다.
    - true
    - 억제자가 평소 결합(전사 ✗) → 알로락토오스 결합 시 떨어짐(전사 ○).
  ref:
  - nn:3
  - nn:4
- id: nn11
  u: 젖당 오페론
  t: mc
  lv: 2
  q: 세균의 오페론과 조절 유전자에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?
  bg:
  - - 오페론은 프로모터, 작동 부위(operator), 구조 유전자로 이루어지며 조절 유전자는 오페론에 포함되지 않는다.
    - true
    - '필기: 오페론 = 프로모터 + operator + 구조 유전자. 조절 유전자(lacI)는 자기 프로모터를 가진 별도 단위.'
  - - 폴리시스트론 mRNA에서 각 구조 유전자는 저마다 SD 서열과 개시 코돈을 가진다.
    - true
    - 한 mRNA에 여러 단백질 정보가 있어 각각 리보솜 결합 자리(SD)와 AUG가 있어요.
  - - lac 조절 유전자(lacI)는 젖당이 있을 때만 발현되어 억제 단백질을 만든다.
    - false
    - 조절 유전자는 항상(구성적으로) 발현돼요. 젖당은 이미 만들어진 억제자를 불활성화할 뿐이에요.
  ref:
  - nn:3
  - nn:4
- id: nn12
  u: 젖당 오페론
  t: mc
  lv: 1
  q: lac 오페론의 구조 유전자와 그 산물의 기능을 짝지은 것으로 옳지 않은 것은?
  c:
  - lacY – 젖당을 포도당과 갈락토오스로 분해하는 효소
  - lacZ – β-갈락토시다아제
